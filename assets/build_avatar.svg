<svg xmlns="http://www.w3.org/2000/svg" width="760" height="58" viewBox="0 0 760 58" role="img" aria-label="custom-avatar-studio">
  <defs>
    <clipPath id="bc-custom-avatar-studio"><rect x="28" y="8" width="0" height="44"><animate attributeName="width" from="0" to="640" begin="1.58s" dur="0.42s" fill="freeze"/></rect></clipPath>
  </defs>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.46s" dur="0.25s" fill="freeze"/>
    <rect x="0.5" y="0.5" width="759" height="57" rx="10" fill="#0A0A0A" stroke="#282828"/>
    <rect x="14" y="14" width="3" height="30" rx="1.5" fill="#d97706">
      <animate attributeName="opacity" values="1;0.45;1" dur="3.0s" begin="2.46s" repeatCount="indefinite"/>
    </rect>
    <g clip-path="url(#bc-custom-avatar-studio)">
      <text x="30" y="25" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="700" fill="#EEEEEE">custom-avatar-studio</text>
      <text x="30" y="43" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#808080">OpenCode pixel typography engine &amp; moving terminal/desktop mascot companion</text>
    </g>
    <rect x="668" y="17" width="66" height="22" rx="5" fill="#141414" stroke="#282828"/>
    <text x="701" y="32" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" fill="#808080">Python</text>
    <text x="746" y="33" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#d97706">&#8599;</text>
  </g>
</svg>
